<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Proyectos</title>

    <!-- Bootstrap desde un CDN (se usa como base de grilla/utilidades) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tipografías del sistema visual: Sora para títulos, Work Sans para texto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Hoja de estilos propia del proyecto -->
    <link href="{% static 'gestion/css/style.css' %}" rel="stylesheet">
</head>
<body>

    <!-- navbar propia, en formato de pastillas, a repetir igual en todas las páginas -->
    <div class="container">
        <nav class="navbar-glass">
            <a class="navbar-brand-text" href="{% url 'dashboard' %}">Gestión de Proyectos</a>

            <div class="d-flex align-items-center gap-3">
                <!-- if user.is_authenticated revisa si hay alguien con sesión iniciada -->
                {% if user.is_authenticated %}
                    <div class="nav-pill-group">
                        <a class="nav-pill {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Resumen</a>
                        <a class="nav-pill {% if '/proyectos/' in request.path %}active{% endif %}" href="{% url 'proyecto_list' %}">Proyectos</a>
                        <a class="nav-pill {% if '/tareas/' in request.path %}active{% endif %}" href="{% url 'tarea_list' %}">Tareas</a>
                    </div>

                    <div class="avatar-gradient" title="{{ user.username }}">{{ user.username|slice:":2"|upper }}</div>

                    <!-- el logout necesita ser un POST, así que uso un formulario en vez de un enlace simple -->
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn-soft btn-sm">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a class="btn-soft btn-sm" href="{% url 'login' %}">Iniciar sesión</a>
                    <a class="btn-gradient btn-sm" href="{% url 'registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </nav>

        <!-- Lugar donde cada página va a meter su propio contenido -->
        <main class="pb-5">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- JS de bootstrap al final del body, para carga mas rapida de la página -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
